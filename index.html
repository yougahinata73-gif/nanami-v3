<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NANAMI v3 🚚 — Krishang Alloy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100%}
body{background:#eae7de;color:#20293a}
.wrap{max-width:960px;margin:0 auto;min-height:100vh;background:#f8f6f0;padding-bottom:46px;box-shadow:0 0 44px rgba(20,32,54,.20)}
button{cursor:pointer;font-family:inherit}
.hidden{display:none!important}
input,select{width:100%;border:1.5px solid #d8d2c2;border-radius:10px;padding:12px 13px;font-size:15px;font-weight:700;font-family:inherit;outline:none;background:#fffdf9;color:#1c2534;transition:border-color .2s, box-shadow .2s}
input:focus{border-color:#b07d2b;box-shadow:0 0 0 3px rgba(176,125,43,.14)}
.btn{border:0;border-radius:10px;padding:13px;font-weight:800;font-size:15px;transition:transform .12s, filter .2s;letter-spacing:.01em}
.btn:active{transform:scale(.98)}
.btn-o{background:#b07d2b;color:#fff;box-shadow:0 3px 10px rgba(176,125,43,.25)}
.btn-o:hover{filter:brightness(1.06)}
.btn-n{background:#132036;color:#fff;box-shadow:0 3px 10px rgba(19,32,54,.25)}
.btn-g{background:#eeeadd;color:#2b3447}
.btn-sm{padding:8px 12px;font-size:12.5px;border-radius:8px}
.card{background:#fff;border:1px solid #e5e0d2;border-radius:14px;padding:16px 14px;box-shadow:0 4px 14px rgba(20,32,54,.07);margin-bottom:12px}
.body{padding:14px}
.anim .card,.anim .stat,.anim .h1,.anim .mut{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.h1{font-size:18px;font-weight:800;color:#132036;margin-bottom:10px;letter-spacing:.01em}
.stepno{font-size:10.5px;font-weight:900;color:#b07d2b;letter-spacing:.14em}
.lbl{font-size:12.5px;font-weight:800;color:#5b6480;margin:12px 0 5px;display:block}
.mut{color:#6b7280;font-size:12px;font-weight:600}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:800;white-space:nowrap}
.p-green{background:#dcfce7;color:#15803d}.p-amber{background:#fef3c7;color:#b45309}.p-red{background:#fee2e2;color:#b91c1c}.p-blue{background:#dbeafe;color:#1d4ed8}.p-gray{background:#e5e7eb;color:#4b5563}
.top{background:#132036;color:#fff;padding:13px 16px;font-weight:900;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:30;border-bottom:2px solid #c9a227}
.top small{font-size:11.5px;color:#a8b8d4;font-weight:700}
.brandGold{font-family:Georgia,'Times New Roman',serif;color:#e6c76a;letter-spacing:.06em}
.tabs{display:flex;gap:6px;padding:10px 12px 0;flex-wrap:wrap}
.tab{border:1px solid #d8d2c2;border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:800;background:#efece2;color:#3c4657;transition:all .18s}
.tab.on{background:#132036;color:#fff;border-color:#132036}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.grid3{grid-template-columns:repeat(2,1fr)}}
.stat{background:#fff;border:1px solid #e5e0d2;border-top:3px solid #c9a227;border-radius:12px;padding:13px 8px 11px;text-align:center;box-shadow:0 3px 10px rgba(20,32,54,.06)}
.stat .sico{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;font-size:18px;margin-bottom:5px;background:#f4efe2;border:1px solid #e5dcc4}
.stat b{display:block;font-size:22px;color:#132036}
.stat>span:last-child{font-size:11px;color:#5b6480;font-weight:800}
.twrap{overflow-x:auto;border-radius:12px;box-shadow:0 4px 14px rgba(20,32,54,.08);border:1px solid #e5e0d2}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
th{background:#132036;color:#fff;text-align:left;padding:9px 10px;font-size:11px;white-space:nowrap}
td{padding:10px;border-bottom:1px solid #f0ede4;font-weight:650}
tr:last-child td{border-bottom:0}
tr.pick{cursor:pointer;transition:background .15s}
tr.pick:active td,tr.pick:hover td{background:#f8f3e6}
.cd{color:#a03434;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#f0ede3;border:1.5px solid #ddd6c4;border-radius:9px;padding:9px 12px;font-size:13px;font-weight:800;color:#37415a;cursor:pointer;transition:all .15s}
.chip.on{border-color:#b07d2b;background:#faf3df;color:#6b4d0f}
.kv{display:flex;gap:8px;align-items:center;background:#f6f3ea;border:1px solid #e9e3d2;border-radius:10px;padding:11px 12px;font-weight:800;font-size:13.5px;color:#37415a}
.banner{border-radius:12px;padding:13px;font-weight:900;text-align:center;font-size:14.5px}
.b-green{background:#eaf5ec;color:#166534;border:1px solid #bfe0c6}
.b-blue{background:#eaf1fb;color:#1d4ed8;border:1px solid #c2d6f5}
.b-gold{background:#faf3df;color:#6b4d0f;border:1px solid #dbc07a;animation:pop .35s}
.lock{background:#132036;color:#e8d9a8;border:1px solid #c9a227;border-radius:12px;padding:16px 14px;text-align:center;font-weight:800;font-size:13.5px;line-height:1.6}
.lockIco{font-size:30px;display:block;margin-bottom:4px}
.dots{display:flex;gap:6px;justify-content:center;padding:4px 0 12px}
.dot{flex:1;max-width:120px;height:5px;border-radius:99px;background:#ddd6c4;transition:all .3s}
.dot.on{background:#b07d2b}
.magic{background:#f0fdf4;border:1.5px dashed #16a34a;color:#15803d;border-radius:10px;padding:10px 12px;font-weight:800;font-size:13px;margin-top:10px}
.vend{display:flex;align-items:center;gap:10px;background:#faf8f2;border:1px solid #eee9da;border-radius:10px;padding:11px 12px;margin-bottom:8px;font-weight:800;font-size:14px}
.vend input{width:20px;height:20px;accent-color:#b07d2b;flex:none}
.vend small{margin-left:auto;color:#b8860b;font-weight:900}
.lb-row{display:flex;align-items:center;gap:10px;padding:12px 8px;border-bottom:1px solid #f0ede4;font-weight:800;border-radius:10px}
.lb-me{background:#faf7ec;box-shadow:inset 0 0 0 2px #e3cf96}
.lb-1{background:#faf3df;box-shadow:inset 0 0 0 1px #ddc27c}
.lb-2{background:#f2f0ea;box-shadow:inset 0 0 0 1px #d8d4c6}
.lb-3{background:#f7f0e8;box-shadow:inset 0 0 0 1px #e0cdb3}
.modal{position:fixed;inset:0;background:rgba(15,25,44,.82);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:14px;overflow:auto}
.mbox{background:#fff;border:1.5px solid #ddd6c4;border-radius:16px;max-width:560px;width:100%;padding:16px;margin-top:12px;animation:pop .25s ease;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#132036;color:#fff;padding:11px 18px;border-radius:99px;font-size:13px;font-weight:800;z-index:70;opacity:0;transition:.3s;pointer-events:none;max-width:88vw;text-align:center;box-shadow:0 8px 24px rgba(19,32,54,.4);border:1px solid #2c4468}
.toast.show{opacity:1}
.alertbar{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:66;background:#132036;color:#ffe6b8;border:1px solid #c9a227;font-weight:800;padding:12px 18px;border-radius:12px;box-shadow:0 12px 30px rgba(19,32,54,.45);opacity:0;transition:.35s;pointer-events:none;max-width:90vw;text-align:center}
.alertbar.show{opacity:1}
.route{display:flex;flex-direction:column}
.rline{display:flex;gap:10px}
.rdot{width:14px;display:flex;flex-direction:column;align-items:center}
.rb{width:12px;height:12px;border-radius:50%;margin-top:4px;flex:none}
.ro{background:#b07d2b;box-shadow:0 0 0 3px rgba(176,125,43,.18)}
.rd{background:#2f6b4f;box-shadow:0 0 0 3px rgba(47,107,79,.16)}
.rwire{width:2px;background:repeating-linear-gradient(#b07d2b 0 4px,transparent 4px 8px);flex:1;min-height:14px;margin:2px 0}
.rtxt{font-size:13px;font-weight:700;line-height:1.35;padding-bottom:6px}

.pbar{position:relative;background:#e7e2d3;border-radius:99px;height:12px;margin:14px 0 8px;border:1px solid #dcd5c2}
.pfill{height:100%;background:#b07d2b;border-radius:99px;transition:width .8s}
.pTruck{position:absolute;top:-9px;transform:translateX(-50%);font-size:17px;transition:left .8s}
.tline-row{display:flex;justify-content:space-between;font-size:12px;font-weight:700;padding:7px 8px 7px 15px;border-bottom:1px dashed #e4dfd2;position:relative}
.tline-row::before{content:'';position:absolute;left:5px;top:12px;width:7px;height:7px;border-radius:50%;background:#b07d2b}
.tline-row:last-child{border-bottom:0}
details.trackD summary{font-size:12.5px;font-weight:800;color:#1e4b8f;cursor:pointer;padding:4px 0}
.simpulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:#16a34a;margin-right:5px;animation:pp 1.1s ease-in-out infinite}
@keyframes pp{50%{opacity:.25;transform:scale(.8)}}

<script>
// ================= TRY DB =================
const CITIES=[
 {n:"Chakan, Maharashtra",pin:"410501",km:294},{n:"Talegaon Dabhade, Maharashtra",pin:"410506",km:294},
 {n:"Mumbai, Maharashtra",pin:"400001",km:205},{n:"Navi Mumbai, Maharashtra",pin:"400614",km:195},

function seed(){const day=86400000,now=Date.now(),C=n=>CITIES.find(x=>x.n===n);
 const mk=(id,ci,wt,qbr,bids,award,dA,p)=>({id,pickup:"Survey No-336&334, P2 Village-Vankas, Tal-Umbergaon, Valsad, Gujarat 396150",

  openT:now-dA*day-40*60000,closeT:now-dA*day,tenureMin:40,vendors:["annu","kk","krishna","ram"],cancelled:false,

 return {nextRfq:99205,nextTrip:502,
  factory:{id:"factory",pass:"factory123",name:"Krishang Alloy"},

  rfqs:[mk(99201,C("Chakan, Maharashtra"),10,22000,{annu:[21699],kk:[21850],krishna:[22010]},{id:"annu",rate:21699},2,"MAP Alloys"),
        mk(99202,C("Pune, Maharashtra"),24,44000,{annu:[42800],ram:[43500]},{id:"annu",rate:42800},2,"Aakar Foundry"),
        mk(99203,C("Surat, Gujarat"),12,16500,{kk:[16200],krishna:[16350]},{id:"kk",rate:16200},1,"")],
  trips:[{id:501,party:"MAP Alloys",city:"Chakan, Maharashtra",pin:"410501",mob:"9822011204",gadi:"DD 01 E 9222 — SUNIL",rfq:99201,status:"done",prog:100,
    startT:now-3*day,endT:now-3*day+8*3600000+5*60000,
    tolls:[{n:"Charoti Toll",fee:95,at:now-3*day+70*60000},{n:"Khaniwadi Toll",fee:110,at:now-3*day+130*60000},{n:"Vasai Toll",fee:85,at:now-3*day+200*60000},{n:"Kalamboli Toll",fee:95,at:now-3*day+280*60000},{n:"Khalapur Expressway",fee:245,at:now-3*day+350*60000},{n:"Talegaon Toll",fee:135,at:now-3*day+430*60000}],
    alerts:[{t:now-3*day+240*60000,txt:"⛔ 25 min halt — Manor ke paas (chai ☕)"},{t:now-3*day+8*3600000,txt:"🏁 Delivered — MAP Alloys, Chakan"}]}]};}
let DB=null,TOKEN=null,LAST='';
try{TOKEN=sessionStorage.getItem('nv3t')||null;}catch(e){}
function save(){}
function api(path,body,cb){fetch('/api/'+path,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},TOKEN?{Authorization:'Bearer '+TOKEN}:{}),body:JSON.stringify(body||{})}).then(r=>r.json()).then(cb).catch(()=>toast('⚠️ Server se sampark nahi'));}
function refresh(cb){fetch('/api/state',{headers:TOKEN?{Authorization:'Bearer '+TOKEN}:{}}).then(r=>r.json()).then(d=>{if(!d||d.ok===false){TOKEN=null;try{sessionStorage.removeItem('nv3t');}catch(e){}ME=null;render();return;}LAST=JSON.stringify(d);DB=d;if(cb)cb();}).catch(()=>{if(cb)cb();});}
function after(){refresh(()=>render(1));}
function poll(){if(!TOKEN)return;fetch('/api/state',{headers:TOKEN?{Authorization:'Bearer '+TOKEN}:{}}).then(r=>r.json()).then(d=>{if(!d||d.ok===false)return;const s=JSON.stringify(d);if(s===LAST)return;LAST=s;DB=d;
 if(ME&&ME.role==='tpt')tptNewsCheck();
 const ae=document.activeElement;
 if(!$('modalHost').innerHTML&&!(ae&&(ae.tagName==='INPUT'||ae.tagName==='SELECT'||ae.isContentEditable)))render(1);}).catch(()=>{});}

// ================= ENGINE =================
const nowI=()=>Date.now();
const isLive=r=>!r.cancelled&&!r.award&&r.openT<=nowI()&&nowI()<r.closeT;
const isClosed=r=>!r.cancelled&&nowI()>=r.closeT;
const stOf=r=>r.award?'Awarded':isLive(r)?'Live':isClosed(r)?'Closed':'Scheduled';
function finals(r){const o={};for(const k in r.bids)o[k]=r.bids[k][r.bids[k].length-1];return o;}
function ranks(r){const f=finals(r);const a=Object.keys(f).map(id=>({id:id,rate:f[id]})).sort((x,y)=>x.rate-y.rate);
 let rk=0,pv=null;a.forEach(x=>{rk=(pv!==null&&x.rate===pv)?rk:rk+1;x.rank=rk;pv=x.rate;});return a;}
function ratingOf(tid){return (DB&&DB.stars&&DB.stars[tid]!==undefined)?DB.stars[tid]:3.0;}
function ratingNote(){const n=nowI(),from=n-10*86400000;
 const old=DB.rfqs.filter(r=>r.closeT>=from&&r.closeT<n&&!r.cancelled).map(r=>r.closeT).sort((a,b)=>a-b)[0];
 if(!old)return "🔄 Rating cycle: har 10 din fresh";
 const d=Math.max(0,Math.ceil((old+10*86400000-n)/86400000));
 return "🔄 Nayi fresh rating "+d+" din me (har 10 din cycle)";}
const lb=()=>DB.transporters.filter(t=>!t.blocked).map(t=>({id:t.id,name:t.name,stars:ratingOf(t.id)})).sort((a,b)=>b.stars-a.stars);
const tName=id=>{const t=DB.transporters.find(x=>x.id===id);return t?t.name:id;};
function dur(ms){const m=Math.max(0,Math.round(ms/60000));const h=Math.floor(m/60);return h>0?(h+"h "+String(m%60).padStart(2,"0")+"m"):(m+" min");}

// ================= APP =================
let ME=null,TAB='dash',SEEN=[];try{SEEN=JSON.parse(localStorage.getItem('ntrySeen3')||'[]');}catch(e){}
const $=id=>document.getElementById(id);
const money=n=>Number(n).toLocaleString('en-IN');
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400);}
function alertbar(m){const a=$('alertbar');a.textContent=m;a.classList.add('show');clearTimeout(a._t);a._t=setTimeout(()=>a.classList.remove('show'),5000);if(navigator.vibrate)navigator.vibrate([180,80,180]);
 try{if('Notification' in window&&Notification.permission==='granted')new Notification('NANAMI 🚚',{body:m});}catch(e){}}
function fmtT(ms){const d=new Date(ms);return d.toLocaleDateString('en-IN',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});}
function greetWord(){const h=new Date().getHours();return h>=5&&h<12?'Good Morning! 🌅':h>=12&&h<17?'Good Afternoon! ☀️':h>=17&&h<21?'Good Evening! 🌇':'Good Night! 🌙';}
function stPill(s){return s==='Live'?'<span class="pill p-red">🔴 Live</span>':s==='Awarded'?'<span class="pill p-green">🏆 Awarded</span>':s==='Closed'?'<span class="pill p-blue">Closed</span>':'<span class="pill p-gray">Scheduled</span>';}
function routeHTML(r){return '<div class="route"><div class="rline"><div class="rdot"><div class="rb ro"></div><div class="rwire"></div></div><div class="rtxt">'+r.pickup+'</div></div><div class="rline"><div class="rdot"><div class="rb rd"></div></div><div class="rtxt">'+r.city+' '+r.pin+'<br><span class="mut">🛣️ '+r.km+' Km 🗺️</span></div></div></div>';}
function shareWA(r){const msg='🚚 Krishang Alloy ka NAYA RFQ #'+r.id+'\n📍 Vankas → '+r.city+'\n⚖️ '+r.weight+' MT • '+r.vehicle+'\n⏰ Band: '+fmtT(r.closeT)+'\nNANAMI app kholo aur rate daalo!';window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');}
function notifOn(){if(!('Notification' in window)){toast('Is browser me notification nahi');return;}
 Notification.requestPermission().then(p=>toast(p==='granted'?'🔔 On! Naya RFQ aate hi ghanta bajega 🔔':'😶 Browser ne mana kar diya'));}
function st(ic,cls,n,lbl,onclick){return '<div class="stat"'+(onclick?' style="cursor:pointer" onclick="'+onclick+'"':'')+'><span class="sico '+cls+'">'+ic+'</span><b>'+n+'</b><span>'+lbl+'</span></div>';}

function render(noAnim){
 if(!ME){$('tabs').innerHTML='';$('who').textContent='Krishang Alloy 🚚';
  $('main').className='body anim';
  $('main').innerHTML='<div class="card" style="max-width:430px;margin:5vh auto 0;padding:0;overflow:hidden">'
  +'<div class="loginHero"><div class="lhTxt">🚚 NANAMI<small>Vankas → Hindustan, fair rate race 🏁</small></div></div>'
  +'<div style="padding:14px 14px 16px">'
  +'<div class="h1" style="text-align:center">'+greetWord()+'</div>'
  +'<div class="mut" style="text-align:center;margin-bottom:4px">Welcome! 👋 Login karo:</div>'
  +'<span class="lbl">ID</span><input id="lid" placeholder="apni ID">'
  +'<span class="lbl">Password</span><input id="lpw" type="password">'
  +'<div style="height:14px"></div><button class="btn btn-o" style="width:100%" onclick="doLogin()">LOGIN →</button>'
  +'<div class="featStrip"><span>🔒 Sealed Bidding</span><span>⭐ Live Rating</span><span>🛰️ SIM Tracking</span><span>📥 Excel Export</span></div>'
  +'<div class="mut" style="margin-top:12px;text-align:center;line-height:1.75">🏢 Company: <b>factory / factory123</b><br>🚛 Transporter: <b>annu / pass123</b> (ya kk, krishna, ram)</div>'
  +'</div></div>';
  return;}
 const isF=ME.role==='factory';
 $('who').innerHTML=ME.name+' '+(isF?'🏢':'📱')+' • <span style="cursor:pointer;text-decoration:underline" onclick="meModal()">✏️</span> • <span style="cursor:pointer" onclick="logout()">Logout</span>';
 const tabs=isF?[['dash','📊 Dashboard'],['live','🔴 RFQs'],['add','➕ Add RFQ'],['track','🛰️ Tracking'],['tpt','👥 Transporters'],['rate','⭐ Ratings']]
              :[['live','🔴 Live RFQs'],['rate','⭐ Ratings'],['hist','📜 History']];
 if(!tabs.some(t=>t[0]===TAB))TAB=tabs[0][0];
 $('tabs').innerHTML=tabs.map(t=>'<button class="tab '+(TAB===t[0]?'on':'')+'" onclick="TAB=\''+t[0]+'\';render()">'+t[1]+'</button>').join('');
 $('main').className='body'+(noAnim?'':' anim');
 $('main').innerHTML=TAB==='dash'?coDash():TAB==='live'?(isF?coList():tptList()):TAB==='add'?coWizard():TAB==='track'?coTrack():TAB==='tpt'?coTpt():TAB==='hist'?tptHist():ratePage();
 if(TAB==='add')fillWizard();
}
function doLogin(){const id=$('lid').value.trim().toLowerCase(),pw=$('lpw').value;
 fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,pass:pw})}).then(r=>r.json()).then(d=>{
  if(!d.ok){toast('⚠️ '+(d.err||'Galat ID ya password'));return;}
  TOKEN=d.token;try{sessionStorage.setItem('nv3t',TOKEN);}catch(e){}
  ME={role:d.role,id:d.id||'factory',name:d.name};
  try{localStorage.setItem('ntryLast3',ME.name);}catch(e){}
  TAB=ME.role==='factory'?'dash':'live';
  refresh(()=>{render();toast('👋 Welcome, '+ME.name+'!');if(ME.role==='tpt')tptNewsCheck();});
 }).catch(()=>toast('⚠️ Server se sampark nahi'));}
function tptNewsCheck(){if(!ME||ME.role!=='tpt'||!DB||!DB.rfqs)return;
 const news=DB.rfqs.filter(r=>isLive(r)&&SEEN.indexOf(r.id)<0);
 news.forEach(r=>SEEN.push(r.id));try{localStorage.setItem('ntrySeen3',JSON.stringify(SEEN));}catch(e){}
 if(news.length)setTimeout(()=>alertbar('🚨 NAYA RFQ #'+news[0].id+' — '+news[0].weight+' MT • '+news[0].city+' — rate daalo!'),700);}
function logout(){ME=null;DB=null;TOKEN=null;LAST='';try{sessionStorage.removeItem('nv3t');}catch(e){}render();}

// ================= COMPANY =================
function coDash(){const rf=DB.rfqs.filter(r=>!r.cancelled);const n=nowI();
 const s={today:rf.filter(r=>r.created>=n-86400000).length,live:rf.filter(isLive).length,total:rf.length,
  tpts:DB.transporters.filter(t=>!t.blocked).length,accepted:rf.filter(r=>r.award).length,declined:rf.filter(r=>isClosed(r)&&!r.award).length,
  tLive:DB.trips.filter(t=>t.status==='live').length,tDone:DB.trips.filter(t=>t.status==='done').length};
 return '<div class="gcard" style="margin-bottom:12px"><div style="font-size:13px;font-weight:700;color:#9db6dd">'+greetWord()+' 👋</div>'
 +'<div style="font-size:22px;font-weight:900">'+ME.name+'</div>'
 +'<div style="font-size:12px;font-weight:700;color:#ffd76e;margin-top:2px">⭐ Rating race chal rahi hai — transporters sasta dene ki jang me!</div></div>'
 +'<div class="grid3">'
 +st('📦','s-bl',s.today,'Today RFQ','')+st('🔴','s-rd',s.live,'Live','')
 +st('🗂️','s-pu',s.total,'Total RFQ','')+st('👥','s-or',s.tpts,'Transporters','')
 +st('🏆','s-gn',s.accepted,'Accepted Bids','')+st('⛔','s-gy',s.declined,'Bids Declined','')
 +st('🛰️','s-tl',s.tLive,'Trips Chal Rahe','TAB=\'track\';render()')+st('🏁','s-gd',s.tDone,'Trips Pahunche','TAB=\'track\';render()')
 +'</div>'
 +'<div style="height:12px"></div><div class="card" style="text-align:center"><button class="btn btn-o" onclick="TAB=\'add\';render()">➕ Naya RFQ Daalo (2 min!)</button></div>';}

function coList(){const rf=DB.rfqs.filter(r=>!r.cancelled).sort((a,b)=>b.id-a.id);
 return '<div class="h1">RFQs List <button class="btn btn-g btn-sm" style="float:right" onclick="exportCSV()">📥 Export</button></div>'
 +(rf.length===0?'<div class="card mut">Abhi koi RFQ nahi — "Add RFQ" se banao ➕</div>':'')
 +'<div class="twrap"><table><tr><th>Id</th><th>Route</th><th>Weight</th><th>Band Hogi</th><th>Bids</th><th>Lowest</th><th>Status</th></tr>'
 +rf.map(r=>{const stt=stOf(r);const rk=ranks(r);
  return '<tr class="pick" onclick="coDetail('+r.id+')">'
  +'<td><b>#'+r.id+'</b></td><td>Vankas → '+r.city.split(',')[0]+'</td><td>'+r.weight+' MT</td>'
  +'<td class="cd" data-close="'+r.closeT+'" data-id="'+r.id+'">'+fmtT(r.closeT)+'</td>'
  +'<td>'+(typeof r.bc==='number'?r.bc:Object.keys(r.bids).length)+'</td>'
  +'<td>'+((isClosed(r)||r.award)&&rk[0]?'₹'+money(rk[0].rate):'🔒')+'</td><td>'+stPill(stt)+'</td></tr>';}).join('')
 +'</table></div><div class="mut" style="margin:8px 4px">👆 Row tap karo — full detail khulegi</div>';}

function coDetail(id){const r=DB.rfqs.find(x=>x.id===id);if(!r)return;const stt=stOf(r);const rk=ranks(r);const bc=(typeof r.bc==='number'?r.bc:Object.keys(r.bids).length);
 let mid='';
 if(stt==='Live'||stt==='Scheduled'){
  mid='<div class="cd" style="font-size:34px;text-align:center" data-close="'+r.closeT+'" data-id="'+r.id+'">--:--</div>'
 +'<div class="mut" style="text-align:center;margin-bottom:10px">⏱ Closes in</div>'
 +'<div class="lock"><span class="lockIco">🔒</span>SEALED BIDDING chal rahi hai<br><span style="font-size:12px;color:#9db6dd">'+bc+' transporters ne rate daal diya ✍️ — rates time ke baad dikhenge</span></div>'
 +'<div style="height:8px"></div><div class="mut" style="text-align:center;background:#f6f3ea;border:1px dashed #d8d2c2;border-radius:10px;padding:10px">⏱️ Server ke time pe apne aap band hogi — uske baad rates khul jayenge 🔒</div>';
 } else {
  mid='<div class="h1" style="font-size:15px">💰 Saare Rates + Ranking</div>'
 +(rk.length?'<div class="twrap"><table><tr><th>Transporter</th><th>Rate ₹</th><th>⭐</th><th>Rank</th><th></th></tr>'
 +rk.map(b=>'<tr><td>'+tName(b.id)+'</td><td><b>'+money(b.rate)+'</b></td><td class="star">★ '+ratingOf(b.id)+'</td>'
 +'<td><span class="pill '+(b.rank===1?'p-green':b.rank===2?'p-blue':'p-gray')+'">P'+b.rank+(b.rank===1?' 🥇':b.rank===2?' 🥈':' 🥉')+'</span></td>'
 +'<td>'+(r.award?(r.award.id===b.id?'🏆':''):'<button class="btn btn-o btn-sm" onclick="doAward('+r.id+',\''+b.id+'\')">Winner Chuno</button>')+'</td></tr>').join('')
 +'</table></div>':'<div class="card mut">Is RFQ pe koi bid nahi aaya (transporters ne rate nahi dala). 💡 Sim se pehle transporter ID se bid daal lo!</div>')
 +(r.award?'<div class="banner b-gold" style="margin-top:10px">🏆 AWARDED: '+tName(r.award.id)+' — ₹'+money(r.award.rate)+' 👏</div>'
   +'<div style="height:8px"></div><button class="btn btn-o" style="width:100%" onclick="openTW('+r.id+')">🚚 Trip Banao — gaadi track karo 🛰️</button>':'');}
 modal('<span class="stepno">RFQ #'+r.id+' • '+stPill(stt)+'</span><div class="h1" style="margin-top:4px">Vankas → '+r.city+'</div>'+routeHTML(r)
 +'<div class="chips">'+(r.party?'<span class="chip">📦 '+r.party+'</span>':'')+'<span class="chip">⚖️ '+r.weight+' MT</span><span class="chip">🚛 '+(r.body?(r.vehicle+' • '+r.body):r.vehicle)+'</span><span class="chip">🏭 '+r.commodity+'</span><span class="chip">QBR ₹'+money(r.qbr)+'</span></div>'
 +'<div class="mut" style="margin:10px 2px">Open: '+fmtT(r.openT)+' • Close: '+fmtT(r.closeT)+' • Tenure '+r.tenureMin+' min</div>'+mid+'<div style="height:12px"></div>'

 let h='<div class="gcard" style="margin-bottom:12px"><div style="font-size:13px;font-weight:700;color:#9db6dd">'+greetWord()+'</div>'
 +'<div style="font-size:20px;font-weight:900">'+ME.name+'</div>'
 +'<div style="font-size:13px;font-weight:800;color:#ffd76e;margin-top:3px">⭐ Aapki Rating: '+ratingOf(ME.id)+' — discount do, upar jao! 🏁</div>'
 +'<button class="btn btn-g btn-sm" style="margin-top:10px" onclick="notifOn()">🔔 Khabar On Karo — naya RFQ aate hi alert!</button></div>'
 +'<div class="h1">🔴 Live RFQs</div>'
 +(liv.length===0?'<div class="card mut">Abhi koi Live RFQ nahi — company daalegi to yahan chamkega 🔔</div>':'');
 liv.forEach(r=>{const my=r.bids[ME.id];
  h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center">'
  +'<span class="stepno">RFQ #'+r.id+'</span><span class="cd" data-close="'+r.closeT+'" data-id="'+r.id+'">--:--</span></div>'+routeHTML(r)
  +'<div class="chips"><span class="chip">⚖️ '+r.weight+' MT</span><span class="chip">🚛 '+(r.body?(r.vehicle+' • '+r.body):r.vehicle)+'</span><span class="chip">🛣️ '+r.km+' Km 🗺️</span></div><div style="height:10px"></div>'
  +(my?'<div class="banner b-blue">✔ Aapka rate: <b>₹'+money(my[my.length-1])+'</b> — '+(3-my.length>0?(3-my.length)+' mauke bache 🎟️':'final 🔒')+'</div><div style="height:8px"></div>':'')
  +(my&&my.length>=3?'':'<input type="number" id="bw'+r.id+'" placeholder="Apna rate daalo ₹/MT (apni marzi!)">'
   +'<div class="mut" style="margin:6px 2px">🔒 Kisi ka rate nahi dikhega • ⭐ discount = rating upar!</div>'
   +'<button class="btn btn-o" style="width:100%" onclick="doBid('+r.id+')">SUBMIT 🟠</button>')+'</div>';});
 if(oth.length)h+='<div class="h1">⏳ Baaki</div>';
 oth.slice(0,8).forEach(r=>{h+='<div class="card pick" onclick="tptView('+r.id+')" style="cursor:pointer"><div style="display:flex;justify-content:space-between;align-items:center">'
  +'<div><b>#'+r.id+'</b> — '+r.city.split(',')[0]+' <span class="mut">'+r.weight+' MT</span></div>'+stPill(stOf(r))+'</div></div>';});
 return h;}
function doBid(id){const r=DB.rfqs.find(x=>x.id===id);if(!r)return;
 const inp=$('bw'+id);const v=parseFloat(inp.value);
 if(!v||v<=0){toast('Rate likho 😄');return;}
 if(!isLive(r)){toast('⏰ Time khatam — ab nahi ja sakta');return;}
 r.bids[ME.id]=r.bids[ME.id]||[];
 if(r.bids[ME.id].length>=3){toast('3 mauke khatam 🔒');return;}
 api('bid',{rfqId:id,rate:v},d=>{if(!d.ok){toast('⚠️ '+(d.err||'Bid nahi hui'));return;}inp.value='';toast('✔ Rate submit! 🔒 kisiko nahi dikha');after();});}
function tptView(id){const r=DB.rfqs.find(x=>x.id===id);if(!r)return;const stt=stOf(r);let mid='';
 if(stt==='Closed'||stt==='Awarded'){
  if(r.won){mid='<div class="banner b-gold">🎉 MUBARAK! Aap jeet gaye — ₹'+money(r.myRate||0)+' pe load aapka! 🏆</div>';}
  else if(r.myRank){mid='<div class="card" style="background:#f8fafc;text-align:center;"><div class="mut">Aapka Rate</div>'
   +'<div style="font-size:24px;font-weight:900">₹ '+money(r.myRate||0)+'</div><div class="mut" style="margin-top:4px">Aapki Position</div>'
   +'<div style="font-size:30px;font-weight:900;color:#16a34a">P'+r.myRank+(r.myRank===1?' 🥇':r.myRank===2?' 🥈':' 🥉')+'</div>'
   +'<div class="mut" style="margin-top:4px">Doosron ke rate kabhi nahi dikhte 🔒</div></div>';}
  else{mid='<div class="card mut">Is RFQ me aapne rate nahi dala tha.</div>';}}
 else mid='<div class="mut">Ye RFQ abhi khuli nahi / chal rahi hai.</div>';
 modal('<span class="stepno">RFQ #'+r.id+' • '+stPill(stt)+'</span><div class="h1" style="margin-top:4px">Vankas → '+r.city+'</div>'+routeHTML(r)
 +'<div class="chips"><span class="chip">⚖️ '+r.weight+' MT</span><span class="chip">🚛 '+(r.body?(r.vehicle+' • '+r.body):r.vehicle)+'</span><span class="chip">🛣️ '+r.km+' Km</span></div><div style="height:12px"></div>'+mid);}
function tptHist(){const done=DB.rfqs.filter(r=>!r.cancelled&&r.vendors.indexOf(ME.id)>=0&&(isClosed(r)||r.award)).sort((a,b)=>b.id-a.id);
 let h='<div class="h1">📜 History</div>'+(done.length===0?'<div class="card mut">Abhi koi purana RFQ nahi.</div>':'');
 done.forEach(r=>{
  h+='<div class="card pick" onclick="tptView('+r.id+')" style="cursor:pointer"><div style="display:flex;justify-content:space-between;align-items:center">'
  +'<div><b>#'+r.id+'</b> — '+r.city.split(',')[0]+'<br><span class="mut">'+r.weight+' MT • '+fmtT(r.closeT)+'</span></div>'
  +'<div>'+(r.won?'<span class="pill p-green">🏆 Jeeta!</span>':r.myRank?'<span class="pill p-blue">P'+r.myRank+'</span>':'<span class="pill p-gray">—</span>')+'</div></div></div>';});
 return h;}

// ================= RATINGS =================
function ratePage(){const L=lb();
 let h='<div class="h1">⭐ Transporter Rating <span class="pill p-amber" style="vertical-align:middle">'+ratingNote()+'</span></div>'
 +'<div class="card"><div class="mut" style="margin-bottom:6px">🏁 Race chal rahi hai! Zyada discount = upar rating</div>';
 L.forEach((t,i)=>{h+='<div class="lb-row '+(i<3?'lb-'+(i+1):'')+' '+(ME.role==='tpt'&&t.id===ME.id?'lb-me':'')+'">'
  +'<div style="width:32px;text-align:center;font-size:19px">'+(['🥇','🥈','🥉'][i]||(i+1))+'</div>'
  +'<div style="flex:1">'+t.name+(ME.role==='tpt'&&t.id===ME.id?' <span class="pill p-amber">Aap</span>':'')+'</div>'
  +'<div class="star">★ '+t.stars+'</div></div>';});
 h+='</div><div class="mut" style="margin:6px 4px">👀 Rating SABKO dikhti hai • 🔒 Rate KABHI nahi dikhte</div>';return h;}

// ================= MISC =================
function modal(h){$('modalHost').innerHTML='<div class="modal" onclick="if(event.target===this)closeModal()"><div class="mbox">'+h
 +'<div style="height:10px"></div><button class="btn btn-g" style="width:100%" onclick="closeModal()">Band Karo ✕</button></div></div>';}
function closeModal(){$('modalHost').innerHTML='';}
function meModal(){modal('<div class="h1">✏️ Mera Naam / Password</div>'
 +'<span class="lbl">Naya Naam</span><input id="meName" value="'+ME.name+'">'
 +'<button class="btn btn-o btn-sm" style="margin-top:8px" onclick="saveName()">Naam Save Karo</button>'
 +'<hr style="margin:14px 0;border:0;border-top:1px solid #eee">'
 +'<span class="lbl">Purana Password</span><input id="meOld" type="password">'
 +'<span class="lbl">Naya Password</span><input id="meNew" type="password">'
 +'<button class="btn btn-n btn-sm" style="margin-top:8px" onclick="savePass()">🔑 Password Badlo</button>');}
function saveName(){const nm=$('meName').value.trim();if(!nm)return;
 api('me',{name:nm},d=>{if(!d.ok){toast('⚠️ Nahi hua');return;}ME.name=nm;closeModal();toast('✔ Naam badal gaya!');after();});}
function savePass(){api('me',{oldPass:$('meOld').value,newPass:$('meNew').value.trim()},d=>{if(!d.ok){toast('⚠️ '+(d.err||'Nahi hua'));return;}closeModal();toast('🔑 Badal gaya!');});}

function boom(){const em=['🎉','✨','🟠','💛','⭐','🎊'];for(let i=0;i<34;i++){const s=document.createElement('span');s.className='cf';s.textContent=em[i%em.length];s.style.left=(Math.random()*100)+'vw';s.style.animationDuration=(1.6+Math.random()*1.6)+'s';s.style.fontSize=(14+Math.random()*16)+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),3400);}}
// ================= SPLASH =================
function hideSplash(){const s=$('splash');if(!s)return;s.style.opacity='0';setTimeout(()=>{s.style.display='none';},550);}
function bootSplash(){const h=new Date().getHours();const ov=$('spOv');if(!ov)return;
 if(h>=5&&h<12)ov.style.background='linear-gradient(180deg,rgba(255,150,70,.12),rgba(50,28,80,.55))';
 else if(h>=12&&h<17)ov.style.background='linear-gradient(180deg,rgba(40,130,230,.10),rgba(14,28,51,.60))';
 else if(h>=17&&h<21)ov.style.background='linear-gradient(180deg,rgba(190,70,150,.16),rgba(22,16,52,.66))';
 else ov.style.background='linear-gradient(180deg,rgba(5,11,29,.35),rgba(5,11,29,.86))';
 $('spGreet').textContent=greetWord();
 let last='';try{last=localStorage.getItem('ntryLast3')||'';}catch(e){}
 $('spName').textContent=last?('Wapas aaye, '+last+'! 👋'):'';
 setTimeout(hideSplash,2600);}

// ================= COUNTDOWN + TRIP ENGINE + AUTO SWITCH =================
let SNAP={};
function tickAll(){let changed=false;
 document.querySelectorAll('[data-close]').forEach(e=>{const close=+e.dataset.close;const left=close-Date.now();
  if(left<=0){e.textContent='Band 🏁';}else{const s=Math.floor(left/1000);
   e.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}});
 if(DB&&DB.rfqs)DB.rfqs.forEach(r=>{const stt=stOf(r);if(SNAP[r.id]==='Live'&&stt!=='Live'){changed=true;alertbar('⏰ RFQ #'+r.id+' band ho gaya! Rates khul gaye 👀');}SNAP[r.id]=stt;});
 if(changed&&!$('modalHost').innerHTML)render(1);}
setInterval(tickAll,1000);
bootSplash();
if(TOKEN){refresh(()=>{if(DB)ME=DB.me;render();});}
else render();
setInterval(poll,5000);
</script>
</body>
</html>
